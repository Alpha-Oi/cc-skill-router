name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check the SessionStart hook
        run: node --check skills/skill-router/analyze-project.mjs
      - name: SKILL.md has valid frontmatter
        run: |
          head -n 1 skills/skill-router/SKILL.md | grep -qx -- '---'
          grep -q '^name: skill-router$' skills/skill-router/SKILL.md
          grep -q '^description: ' skills/skill-router/SKILL.md
